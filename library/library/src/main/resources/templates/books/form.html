<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить книгу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); min-height: 100vh; display: flex; align-items: center; }
        .form-card { border-radius: 20px; border: none; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .form-header { background: linear-gradient(45deg, #43e97b 0%, #38f9d7 100%); border-radius: 20px 20px 0 0; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="card form-card w-50 mx-auto">
        <div class="card-header form-header p-4"><h3 class="mb-0">Новая книга</h3></div>
        <div class="card-body p-5">
            <form th:action="@{/books/save}" th:object="${book}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">Название:</label>
                    <input type="text" th:field="*{title}" class="form-control form-control-lg shadow-sm" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Автор:</label>
                    <input type="text" th:field="*{author}" class="form-control form-control-lg shadow-sm" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Количество страниц:</label>
                    <input type="number" th:field="*{pages}" class="form-control form-control-lg shadow-sm" required>
                </div>
                <div class="mb-5">
                    <label class="form-label fw-bold">Статус:</label>
                    <select th:field="*{status}" class="form-select form-select-lg shadow-sm">
                        <option value="Свободна">Свободна</option>
                        <option value="Занята">Занята</option>
                    </select>
                </div>
                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-success btn-lg rounded-pill shadow">Сохранить</button>
                    <a href="/books" class="btn btn-outline-secondary btn-lg rounded-pill">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
