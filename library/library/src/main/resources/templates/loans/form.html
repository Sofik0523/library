<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Выдать книгу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); min-height: 100vh; display: flex; align-items: center; }
        .form-card { border-radius: 20px; border: none; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .form-header { background: linear-gradient(45deg, #f6d365 0%, #fda085 100%); border-radius: 20px 20px 0 0; color: #333; }
    </style>
</head>
<body>
<div class="container">
    <div class="card form-card w-50 mx-auto">
        <div class="card-header form-header p-4"><h3 class="mb-0 fw-bold">Выдача книги</h3></div>
        <div class="card-body p-5">
            <form th:action="@{/loans/save}" th:object="${loan}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">Читатель:</label>
                    <select th:field="*{reader}" class="form-select form-select-lg shadow-sm" required>
                        <option value="">-- Выберите читателя --</option>
                        <option th:each="r : ${readers}" th:value="${r.id}" th:text="${r.fullName}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Книга (только свободные):</label>
                    <select th:field="*{book}" class="form-select form-select-lg shadow-sm" required>
                        <option value="">-- Выберите книгу --</option>
                        <option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title} + ' (' + ${b.author} + ')'"></option>
                    </select>
                    <small class="text-muted">Показываются только книги со статусом «Свободна»</small>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Дата выдачи:</label>
                        <input type="date" th:field="*{issueDate}" class="form-control form-control-lg shadow-sm" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Вернуть до:</label>
                        <input type="date" th:field="*{dueDate}" class="form-control form-control-lg shadow-sm" required>
                    </div>
                </div>
                <div class="d-grid gap-3 mt-3">
                    <button type="submit" class="btn btn-warning text-dark fw-bold btn-lg rounded-pill shadow">Выдать книгу</button>
                    <a href="/loans" class="btn btn-outline-secondary btn-lg rounded-pill">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
