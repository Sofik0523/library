<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добро пожаловать</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card-custom { border-radius: 25px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.3); background: rgba(255, 255, 255, 0.95); }
        .btn-role { width: 250px; height: 80px; font-size: 20px; border-radius: 15px; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card card-custom p-5 mx-auto text-center" style="max-width: 600px;">
        <h1 class="mb-4 fw-bold text-primary">📚 Библиотека</h1>
        <p class="fs-5 text-muted mb-5">Выберите, как вы хотите войти в систему:</p>

        <div class="d-flex flex-column align-items-center">
            <a href="/login" class="btn btn-primary btn-role shadow">👨‍💼 Я Администратор</a>
            <a href="/login" class="btn btn-success btn-role shadow">👤 Я Читатель</a>
        </div>

        <div th:if="${param.logout}" class="alert alert-success mt-4">Вы успешно вышли из системы.</div>
    </div>
</div>
</body>
</html>
