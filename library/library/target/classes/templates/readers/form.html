<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить читателя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); min-height: 100vh; display: flex; align-items: center; }
        .form-card { border-radius: 20px; border: none; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .form-header { background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%); border-radius: 20px 20px 0 0; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="card form-card w-50 mx-auto">
        <div class="card-header form-header p-4"><h3 class="mb-0">Новый читатель</h3></div>
        <div class="card-body p-5">
            <form th:action="@{/readers/save}" th:object="${reader}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">ФИО:</label>
                    <input type="text" th:field="*{fullName}" class="form-control form-control-lg shadow-sm" placeholder="Иванов Иван Иванович" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Дата рождения:</label>
                    <input type="date" th:field="*{birthDate}" class="form-control form-control-lg shadow-sm" required>
                </div>
                <div class="mb-5">
                    <label class="form-label fw-bold">Телефон:</label>
                    <input type="text" th:field="*{phone}" class="form-control form-control-lg shadow-sm" placeholder="+7 (999) 123-45-67" required>
                </div>
                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow">Сохранить</button>
                    <a href="/readers" class="btn btn-outline-secondary btn-lg rounded-pill">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
