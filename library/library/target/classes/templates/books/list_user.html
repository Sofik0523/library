<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог книг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #f4f7f6; min-height: 100vh; }
        .card-book { border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card-book:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .stars { color: #ffc107; font-size: 1.2rem; }
        .book-title { font-weight: bold; color: #333; }
        .badge-status { font-size: 0.9rem; padding: 8px 12px; }
        .star-btn { text-decoration: none; font-size: 1.5rem; color: #ffc107; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">📚 Каталог книг</h2>
        <a href="/home?role=user" class="btn btn-outline-dark rounded-pill px-4">← В меню</a>
    </div>

    <!-- Сообщение об успехе -->
    <div th:if="${param.wanted}" class="alert alert-success alert-dismissible fade show" role="alert">
        Спасибо! Мы сообщим вам, когда книга появится в наличии.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <!-- Перебор всех книг -->
        <div class="col" th:each="b : ${books}">
            <div class="card card-book h-100 p-3">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="book-title mb-0" th:text="${b.title}"></h5>
                        <!-- Статус -->
                        <span th:if="${b.status == 'Свободна'}" class="badge bg-success rounded-pill badge-status">В наличии</span>
                        <span th:if="${b.status == 'Занята'}" class="badge bg-danger rounded-pill badge-status">Занята</span>
                    </div>

                    <p class="text-muted mb-1" th:text="'Автор: ' + ${b.author}"></p>
                    <p class="text-muted small mb-3" th:text="'Страниц: ' + ${b.pages}"></p>

                    <!-- ПОЛОСКА ПРОЦЕНТА ПРОЧТЕНИЯ -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="text-muted">Прочитано</small>
                            <small class="fw-bold" th:text="${b.progress} + '%'"></small>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div class="progress-bar bg-info" role="progressbar"
                                 th:style="'width: ' + ${b.progress} + '%'"
                                 th:attr="aria-valuenow=${b.progress}"
                                 aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>

                    <!-- Рейтинг (Звездочки для отображения) -->
                    <div class="mb-3 d-flex align-items-center">
                        <div class="stars me-2">
                            <i class="bi bi-star-fill" th:if="${b.rating >= 1}"></i>
                            <i class="bi bi-star" th:if="${b.rating < 1}"></i>
                            <i class="bi bi-star-fill" th:if="${b.rating >= 2}"></i>
                            <i class="bi bi-star" th:if="${b.rating < 2}"></i>
                            <i class="bi bi-star-fill" th:if="${b.rating >= 3}"></i>
                            <i class="bi bi-star" th:if="${b.rating < 3}"></i>
                            <i class="bi bi-star-fill" th:if="${b.rating >= 4}"></i>
                            <i class="bi bi-star" th:if="${b.rating < 4}"></i>
                            <i class="bi bi-star-fill" th:if="${b.rating >= 5}"></i>
                            <i class="bi bi-star" th:if="${b.rating < 5}"></i>
                        </div>
                        <span class="text-muted small" th:text="${b.rating} + '/5'"></span>
                    </div>

                    <!-- Кнопка "Хочу" (видна, если книга занята) -->
                    <div class="mt-auto">
                        <a th:if="${b.status == 'Занята'}" th:href="@{/books/want/{id}(id=${b.id})}" class="btn btn-outline-warning btn-sm w-100 rounded-pill mb-2">
                            <i class="bi bi-bell"></i> Сообщите, когда появится
                        </a>

                        <!-- Оценка книги (клик по звездам) -->
                        <div class="d-flex justify-content-between mt-2 border-top pt-2">
                            <small class="text-muted d-flex align-items-center">Оценить:</small>
                            <div class="d-flex">
                                <a th:href="@{/books/rate/{id}(id=${b.id}, rating=1)}" class="star-btn">★</a>
                                <a th:href="@{/books/rate/{id}(id=${b.id}, rating=2)}" class="star-btn">★</a>
                                <a th:href="@{/books/rate/{id}(id=${b.id}, rating=3)}" class="star-btn">★</a>
                                <a th:href="@{/books/rate/{id}(id=${b.id}, rating=4)}" class="star-btn">★</a>
                                <a th:href="@{/books/rate/{id}(id=${b.id}, rating=5)}" class="star-btn">★</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(books)}" class="text-center text-muted mt-5">
        <h4>Книг пока нет :(</h4>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
