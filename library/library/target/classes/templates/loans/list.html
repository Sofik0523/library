<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Выдачи книг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); min-height: 100vh; }
        .custom-card { border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .table { border-radius: 15px; overflow: hidden; }
        .table thead { background: linear-gradient(45deg, #f6d365 0%, #fda085 100%); color: #333; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">📋 Журнал выдач</h2>
        <a href="/" class="btn btn-outline-dark rounded-pill px-4">← На главную</a>
    </div>

    <div class="mb-4">
        <a href="/loans/new" class="btn btn-warning text-dark rounded-pill px-4 shadow fw-bold">+ Выдать книгу</a>
    </div>

    <div class="card custom-card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 text-center align-middle">
                <thead>
                <tr><th>ID</th><th>Читатель</th><th>Книга</th><th>Дата выдачи</th><th>Вернуть до</th><th>Действия</th></tr>
                </thead>
                <tbody>
                <tr th:each="l : ${loans}">
                    <td th:text="${l.id}"></td>
                    <td th:text="${l.reader.fullName}" class="fw-bold"></td>
                    <td th:text="${l.book.title}"></td>
                    <td th:text="${l.issueDate}"></td>
                    <td th:text="${l.dueDate}"></td>
                    <td><a th:href="@{/loans/delete/{id}(id=${l.id})}" class="btn btn-sm btn-danger rounded-pill px-3">Вернуть</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(loans)}"><td colspan="6" class="text-muted py-4">Выдач пока нет.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
